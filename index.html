<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔮 A Voz da Alma — Oráculo de Maria Madalena</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🔮 A Voz da Alma</h1>
            <div class="subtitle">Oráculo de Maria Madalena</div>
            <p class="intro-text">
                "A Alma não responde à pressa. Ela revela-se à presença."<br>
                Antes de tirar a sua carta, respire fundo, acalme a mente e pergunte em silêncio:<br>
                <strong>«O que a minha Alma precisa de recordar hoje?»</strong>
            </p>
        </header>

        <main>
            <!-- Menu de Opções -->
            <div class="menu-section">
                <button class="menu-btn" id="singleCardBtn">Carta do Dia</button>
                <button class="menu-btn" id="threeCardBtn">Tiragem 3 Cartas</button>
                <button class="menu-btn" id="fiveCardBtn">Tiragem 5 Cartas</button>
                <button class="menu-btn reset-btn" id="resetBtn">Nova Consulta</button>
            </div>

            <!-- Baralho Visual -->
            <div class="deck-section">
                <div class="deck-visual" id="deckVisual">
                    <div class="card-back">🔮</div>
                </div>
            </div>

            <!-- Área de Cartas Reveladas -->
            <div class="cards-display" id="cardsDisplay"></div>

            <!-- Detalhe da Carta -->
            <div class="card-detail hidden" id="cardDetail"></div>
        </main>

        <footer>
            <p>© 2026 A Voz da Alma | Criado por Sofia Caldeira</p>
        </footer>
    </div>

    <script src="js/cards-data.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
